[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lionelmessi"
version = "0.1.0"
description = "Scientific football analytics engine for Lionel Messi's career: xT, VAEP-style action values, continuation chains, goals, assists, and pitch-level visualizations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lionelmessi contributors" }]
keywords = [
  "football",
  "soccer",
  "messi",
  "lm10",
  "statsbomb",
  "expected-threat",
  "xt",
  "vaep",
  "analytics",
  "sports-science",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "polars>=1.21",
  "pyarrow>=14.0",
  "requests>=2.28",
  "matplotlib>=3.7",
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.5",
]

[project.optional-dependencies]
viz = ["mplsoccer>=1.2", "seaborn>=0.13"]
ml = ["scikit-learn>=1.3"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-requests",
  "twine",
  "build",
  "pre-commit",
]

[project.scripts]
lionelmessi = "lionelmessi.cli:app"

[project.urls]
Homepage = "https://github.com/Sraviprovez/lionelmessi"
Repository = "https://github.com/Sraviprovez/lionelmessi"
Issues = "https://github.com/Sraviprovez/lionelmessi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lionelmessi"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/lionelmessi"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
addopts = "-q --cov=lionelmessi --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lionelmessi"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
